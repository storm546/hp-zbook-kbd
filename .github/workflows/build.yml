name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s linux/tests -v
      - run: bash -n linux/install.sh
      - run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          make -C linux KDIR="$headers" W=1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: windows\build.cmd
        shell: cmd
